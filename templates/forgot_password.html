<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password · WellBeingTracker</title>
  <meta name="description" content="Reset your password for Digital Well-Being Tracker." />
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.min.js"></script>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <canvas id="threeCanvas" class="three-canvas"></canvas>
      <div class="brand-inner">
        <div class="brand-logo">
          <span class="logo-text">WellBeing<span class="logo-accent">Tracker</span></span>
        </div>
        <h1 class="brand-headline"><strong>Track</strong> your digital life.<br/>Own your time.</h1>
      </div>
      <div class="brand-glow"></div>
    </div>

    <!-- ░░░ AUTH CARD ░░░ -->
    <div class="auth-card-wrap">
      <div class="auth-card glass-card">
        <div class="auth-header">
          <h2 class="auth-title">Forgot <span>Password</span></h2>
          <p class="auth-subtitle">Enter your email to receive a reset link</p>
        </div>

        {% if message %}
        <div class="auth-error" id="authMessage" role="alert" style="background: rgba(0,230,118,0.1); border-color: rgba(0,230,118,0.3); color: var(--green-vivid);">
          <span class="err-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></span> {{ message }}
        </div>
        {% endif %}

        <form class="auth-form" method="POST" action="/forgot-password" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></span>
              <input class="form-input auth-input" type="email" id="email" name="email" placeholder="Enter your email" required />
            </div>
          </div>


          <button type="submit" class="btn-green btn-lg auth-btn">
            <span class="btn-text">Send Reset Link</span>
          </button>
        </form>

        <div class="auth-divider"><span>Remembered your password?</span></div>
        <a href="/login" class="btn-outline auth-link-btn">Return to Login</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
  <script src="{{ url_for('static', filename='js/3d-scene.js') }}"></script>
</body>
</html>
